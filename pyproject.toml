[project]
name = "speclint"
version = "0.1.0"
description = "Lint user stories and PRDs for untestable acceptance criteria, missing edge cases, and metrics without a baseline."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Huy Doan", email = "huydoanhg.work@gmail.com" }]
keywords = ["business-analysis", "product-management", "user-story", "acceptance-criteria", "gherkin", "linter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
speclint = "speclint.cli:main"

[project.urls]
Homepage = "https://github.com/huydhg/speclint"
Issues = "https://github.com/huydhg/speclint/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["speclint"]
